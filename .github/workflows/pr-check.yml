name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore CompanySyncApp.slnx
      - name: Build solution
        run: dotnet build CompanySyncApp.slnx --configuration Release --no-restore
